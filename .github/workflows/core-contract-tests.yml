name: Hubie Core contract checks
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/test_*.py'
      - '.github/workflows/core-contract-tests.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
