name: Hubie App Factory Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate readiness report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          REPORT=ops/readiness.md
          echo '# Hubie PWA Readiness' > "$REPORT"
          echo >> "$REPORT"
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          echo >> "$REPORT"

          check_file() {
            local path="$1"
            local label="$2"
            if [ -e "$path" ]; then
              echo "- [x] $label — \`$path\`" >> "$REPORT"
            else
              echo "- [ ] $label — waiting for \`$path\`" >> "$REPORT"
            fi
          }

          check_file package.json 'Application package'
          check_file public/manifest.webmanifest 'PWA manifest'
          check_file public/sw.js 'Service worker'
          check_file netlify.toml 'Hosting configuration'
          check_file supabase/migrations 'Database migrations'
          check_file SECURITY.md 'Security policy'
          check_file .env.example 'Environment contract'
          check_file app-factory.yml 'App Factory contract'

          echo >> "$REPORT"
          echo 'This workflow is intentionally informational during bootstrap. Product CI becomes blocking once package.json exists.' >> "$REPORT"
          cat "$REPORT"

      - uses: actions/upload-artifact@v4
        with:
          name: Hubie-App-Factory-Readiness-${{ github.run_id }}
          path: ops/readiness.md
          retention-days: 30
