name: Hubie PWA Madre Tests
on:
  push:
    branches: [feat/pwa-madre-multitenant]
  pull_request:
    paths:
      - 'platform/**'
      - 'admin.mjs'
      - 'server.mjs'
      - 'database.mjs'
      - 'tenant.mjs'
      - 'google-oidc.mjs'
      - 'app/**'
      - 'tests/**'
      - 'turso/**'
      - '.github/workflows/pwa-core-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Smoke test private shells and protected source
        run: |
          PORT=4017 HUBIE_AUTH_ENABLED=false node server.mjs > /tmp/hubie.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4017/app/ -o /tmp/hubie-client.html; then break; fi
            sleep 1
          done
          grep -q 'Espacio privado' /tmp/hubie-client.html
          curl -fsS http://localhost:4017/madre/app.html -o /tmp/hubie-madre.html
          grep -q 'Control de Suites' /tmp/hubie-madre.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/platform/catalog.mjs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/api/admin/catalog)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/healthz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/auth/configuracion.html)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/api/auth/google/start)" = 303
          curl -fsS http://localhost:4017/assets/demo-backend.js | grep -q 'createDemoStore'
          curl -fsS http://localhost:4017/assets/pwa-refined.css | grep -q 'HUBIE PWA'
          curl -fsS http://localhost:4017/assets/appearance-ui.js | grep -q 'createAppearanceEditor'
          curl -fsS http://localhost:4017/assets/pwa-navigation.css | grep -q 'nav-group'
          curl -fsS http://localhost:4017/assets/attachments-ui.js | grep -q 'setupAttachments'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/api/admin/media/dashboard)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4017/api/app/test-company/tools/C001/records/00000000-0000-4000-8000-000000000000/attachments)" = 503
      - name: Validate JavaScript syntax
        run: |
          for file in server.mjs database.mjs admin.mjs auth.mjs google-oidc.mjs tenant.mjs platform/*.mjs assets/admin-console.js assets/app-console.js assets/app-records.js assets/tool-forms.js assets/demo-backend.js assets/appearance-ui.js assets/media-ui.js assets/attachments-ui.js assets/ui-icons.js assets/app-workflows.js assets/operational-*.js; do
            node --check "$file"
          done
      - name: Run unit and contract tests
        run: npm test
      - name: Validate Turso schema
        run: python -m unittest discover -s tests -p 'test_*.py'
