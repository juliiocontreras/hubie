<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16123a"><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/pwa-console.css"><link rel="stylesheet" href="/assets/pwa-refined.css">
<title>Invitación a Hubie</title></head><body>
<section class="login-page"><div class="card">
<img src="/assets/hubie-logo-official.png" alt="Hubie" width="145">
<span class="eyebrow">Invitación a Hubie</span>
<h1 id="invite-title">Revisando tu invitación…</h1>
<p class="subline" id="invite-detail">Un momento, estamos validando el enlace.</p>
<p class="message" id="invite-message" role="status"></p>
<div class="toolbar" id="invite-actions" hidden>
<button type="button" class="btn btn-primary" id="invite-accept">Aceptar invitación</button>
<a class="btn" id="invite-open-app" href="/app/" hidden>Abrir mi empresa</a>
</div>
<div class="toolbar" id="invite-login" hidden>
<a class="btn btn-primary" id="invite-google" href="/api/auth/google/start">Iniciar sesión con Google</a>
</div>
<p class="help">La invitación es válida 7 días y solo se puede usar una vez. Si ya la aceptaste o venció, pide una nueva a tu administrador.</p>
</div></section>
<script src="/assets/invitation-accept.js" defer></script></body></html>
