<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Hubie</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;background:linear-gradient(145deg,#f7faff,#f4f0ff);font:15px Poppins,system-ui,sans-serif;color:#253354}main{max-width:1040px;margin:70px auto;padding:22px}h1{font-size:clamp(29px,5vw,48px)}.panel{background:white;border:1px solid #e5e9fb;border-radius:24px;padding:26px;box-shadow:0 16px 60px #30487b12}a.button,button{display:inline-block;background:#5268e8;color:white;border:0;border-radius:12px;padding:13px 18px;text-decoration:none;font-weight:700;cursor:pointer}input,select{padding:12px;border:1px solid #d7dff1;border-radius:11px;width:100%;box-sizing:border-box}label{display:block;margin:12px 0 5px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.muted{color:#6a7590}li{padding:8px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}main{margin:20px auto}}</style></head><body><main><p class="muted">HUBIE / CONTROL CENTRAL</p><h1>Administra tus Suites desde un solo lugar.</h1><div class="panel" id="login"><p>Accede con tu cuenta de Google autorizada para gestionar las empresas.</p><a class="button" href="/api/auth/google/start">Continuar con Google</a><p id="notice" class="muted"></p></div><section class="panel" id="dashboard" hidden><h2>Empresas</h2><ul id="tenants"></ul><h3>Crear empresa</h3><form id="create"><div class="grid"><div><label>Nombre de empresa</label><input name="name" required minlength="2"></div><div><label>Identificador web</label><input name="slug" required pattern="[a-z0-9-]{3,63}" placeholder="mi-empresa"></div><div><label>Suite</label><select name="suiteId" id="suites" required></select></div><div><label>Color de marca</label><input type="color" name="primaryColor" value="#4768ee"></div></div><p><button>Crear empresa</button></p></form><p id="feedback" role="status"></p><button id="logout" type="button">Cerrar sesión</button></section></main><script>const login=document.getElementById('login'),dash=document.getElementById('dashboard'),notice=document.getElementById('notice'),feedback=document.getElementById('feedback');if(location.search.includes('failed'))notice.textContent='No se pudo iniciar sesión. Verifica que utilizas la cuenta autorizada.';async function refresh(){const r=await fetch('/api/admin/tenants',{credentials:'same-origin'});if(!r.ok){notice.textContent=r.status===503?'La configuración de Google aún está pendiente.':'Accede con la cuenta de administrador autorizada.';return;}const data=await r.json();login.hidden=true;dash.hidden=false;const ul=document.getElementById('tenants');ul.replaceChildren();for(const t of data.tenants){const li=document.createElement('li');li.textContent=t.name+' · '+t.slug+' · '+(t.suiteId||'Sin Suite');ul.append(li);}}fetch('/assets/catalog.json').then(r=>r.json()).then(data=>{for(const s of data.suites||[]){const opt=document.createElement('option');opt.value=s.id;opt.textContent=s.name;document.getElementById('suites').append(opt);}}).catch(()=>{});document.getElementById('create').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/admin/tenants',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)});feedback.textContent=r.ok?'Empresa creada correctamente.':'No fue posible crear la empresa. Revisa los datos.';if(r.ok){e.target.reset();await refresh();}});document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.reload();};refresh().catch(()=>notice.textContent='Servicio temporalmente no disponible.');</script></body></html>
